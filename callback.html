<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge" >
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="">
	<link rel="stylesheet" type="text/css" href="style.css">
	<link rel="icon" type="image/png" href="favicon/favicon.ico" sizes="16x16">	
	<title>Ваш Ассистент в сфере лизинга</title>
</head>
<body>
	<div class="wrapper">
	<!-- Content -->
	<div class="content">
	<!-- Section 1 - Callback -->
	<section class="callback_sect">
		<img class="bg_img" src="img/callback_bg.jpg" alt="" loading="lazy" />
		<div class="form_wrapp">
			<form>
				<h3>Оставьте заявку на приобретение техники в лизинг и наш менеджер свяжется с Вами</h3>
				<div class="form_box">
					<div class="input_wrapp">
						<input type="text" placeholder="Ваше ИМЯ" />
					</div>
					<div class="input_wrapp">
						<input type="text" placeholder="Контактный телефон для связи" />
					</div>
					<div class="input_wrapp">
						<input type="text" placeholder="ИНН компании" />
					</div>
					<div class="input_wrapp">
						<input type="text" placeholder="Предмет лизинга " />
					</div>
					<div class="input_wrapp">
						<input type="text" placeholder="Стоимость предмета лизинга" />
					</div>
					<div class="input_wrapp">
						<input type="text" placeholder="Нужен ли подбор предмета лизинга" />
					</div>
					<div class="input_wrapp">
						<input type="text" placeholder="Информация о годовой выручке " />
					</div>
					<div class="submit_wrapp">
						<button type="submit" class="transparent_pill">Оставить заявку</button>
					</div>
					<div class="transparent_link_wrapp">
						<a href="/" class="transparent_link">Вернуться на главную </a>
					</div>
				</div>
			</form>
		</div>
	</section>
	<!-- /Section 1 - Callback -->
	</div>
	<!-- /Content -->
	<!-- Footer -->
	<footer class="footer_section">
		<div class="row">
			<div class="footer_templ">
				<div>
					<h3>НАВИГАЦИЯ</h3>
					<ul class="footer_nav">
						<li><a href="#">О нас</a></li>
						<li><a href="#">Помощь в подборе</a></li>
						<li><a href="#">Услуги</a></li>
						<li><a href="#">Оставить заявку</a></li>
					</ul>
				</div>
				<div>
					<p>ООО Ассистент</p>
				</div>
			</div>
		</div>
	</footer>
	<!-- /Footer -->
	</div>
	<link rel="stylesheet" type="text/css" href="responsive.css">
	<script src="vendors/js/jquery.js"></script>
	<script src="js/scripts.js"></script>
</body>
</html>
